[alembic]
script_location = migrations
prepend_sys_path = packages
# The URL is read from AIVE_DB_URL in migrations/env.py so that there is one
# source of truth for it; this value is only a fallback.
sqlalchemy.url = sqlite:///./data/aive.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
